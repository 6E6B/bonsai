        "200": { description: OK, schema: { $ref: "#/definitions/QuickLoginStatus" } }
  /auth-token-service/v1/login/cancel:
    post:
      # Captured 2026-10-14 live (fixture: quick_sign_in.json). Sent by the site when the code
      # dialog closes. Answers {}.
      x-captured: "2026-10-14, www.roblox.com/login, Quick Log In"
      x-rust-name: post_quick_login_cancel
      summary: Cancel a quick sign-in code.
      parameters:
        - { in: body, name: body, required: true, schema: { $ref: "#/definitions/QuickLoginCancel" } }
      responses:
        "200": { description: OK, schema: { type: object } }
  /auth-token-service/v1/login/enterCode:
    post:
      # Read 2026-10-16 from CrossDeviceLoginConfirmCode.js on www.roblox.com/crossdevicelogin/
      # ConfirmCode (signed in), checked live (fixture: quick_sign_in_approve.json). Links the
      # signed-in account to a code another device shows and says which device that is. The
      # site checks the code against ^[a-zA-Z0-9]{6}$ and sends it upper-cased. Errors answer
      # with a bare string body: "InvalidLocation" (the other device is somewhere else) or
      # another code such as "CodeInvalid".
      x-captured: "2026-10-16, www.roblox.com/crossdevicelogin/ConfirmCode"
      x-rust-name: post_quick_login_enter_code
      summary: Link a quick sign-in code to the signed-in account and see the device asking.
      parameters:
        - { in: body, name: body, required: true, schema: { $ref: "#/definitions/QuickLoginCancel" } }
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/QuickLoginDevice" } }
  /auth-token-service/v1/login/validateCode:
    post:
      # Same page (fixture: quick_sign_in_approve.json): "Confirm" after enterCode. The other
      # device's status poll then says Validated and it signs in. "Cancel" sends login/cancel.
      x-captured: "2026-10-16, www.roblox.com/crossdevicelogin/ConfirmCode"
      x-rust-name: post_quick_login_validate_code
      summary: Approve a quick sign-in code entered with enterCode.
      parameters:
        - { in: body, name: body, required: true, schema: { $ref: "#/definitions/QuickLoginCancel" } }
      responses:
        "200": { description: OK, schema: { type: object } }
  /transaction-records/v1/users/{userId}/transaction-totals:
    get:
      # Captured 2026-10-15 from the Transactions bundle (www.roblox.com/transactions, Summary)
      # and checked live (fixture: transactions.json). The site also sends usedTypes, a bitmask
      # of the types the account has; the answer is the same without it.
      x-captured: "2026-10-15, www.roblox.com/transactions, Summary"
      x-rust-name: get_user_transaction_totals
      summary: Robux in and out per category over the last day, week, month or year.
      parameters:
        - { in: path, name: userId, required: true, type: integer, format: int64 }
        - { in: query, name: timeFrame, required: true, type: string, description: "Day, Week, Month or Year" }
        - { in: query, name: transactionType, required: true, type: string, description: "Always summary" }
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/TransactionTotals" } }
  /transaction-records/v1/users/{userId}/transaction-types:
    get:
      # Captured 2026-10-15 from the Transactions bundle, checked live (fixture: transactions.json).
      # The site fills its type dropdown from it.
      x-captured: "2026-10-15, www.roblox.com/transactions"
      x-rust-name: get_user_transaction_types
      summary: Which transaction types the account has, as HasPurchase, HasSale, ... flags.
      parameters:
        - { in: path, name: userId, required: true, type: integer, format: int64 }
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/TransactionTypeFlags" } }
  /transaction-records/v1/users/{userId}/transactions:
    get:
      # Captured 2026-10-15 from the Transactions bundle, checked live (fixture: transactions.json).
      # One type per call, newest first. The cursor is an offset. `id` is 0 on every row;
      # `idHash` names the row. 429 after about 8 quick calls.
      x-captured: "2026-10-15, www.roblox.com/transactions, type dropdown"
      x-rust-name: get_user_transactions
      summary: One kind of transaction for a user, newest first.
      parameters:
        - { in: path, name: userId, required: true, type: integer, format: int64 }
        - { in: query, name: transactionType, required: true, type: string, description: "Purchase, Sale, PremiumStipend, GroupPayout, CurrencyPurchase, TradeRobux, ..." }
        - { in: query, name: limit, required: false, type: integer, format: int32, description: "10, 25, 50 or 100" }
        - { in: query, name: cursor, required: false, type: string }
        - { in: query, name: itemPricingType, required: false, type: string, description: "PaidAndLimited or All (purchases)" }
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/TransactionsPage" } }
  /transaction-records/v1/groups/{groupId}/transactions:
    get:
      # Captured 2026-10-15 from the Transactions bundle: the same call as for users with
      # "groups" in the path (communities/configure#!/revenue). Not run live: the test account
      # can't see any community's funds (fixture: synthetic, transactions_groups.json).
      x-captured: "2026-10-15, www.roblox.com/communities/configure?id={id}#!/revenue/sales"
      x-rust-name: get_group_transactions
      summary: One kind of transaction for a community, newest first.
      parameters:
        - { in: path, name: groupId, required: true, type: integer, format: int64 }
        - { in: query, name: transactionType, required: true, type: string }
        - { in: query, name: limit, required: false, type: integer, format: int32 }
        - { in: query, name: cursor, required: false, type: string }
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/TransactionsPage" } }
  /transaction-records/v1/groups/{groupId}/revenue/summary/{timeFrame}:
    get:
      # Captured 2026-10-15 from the Transactions bundle (revenueSummary template). Field names
      # from that template. Not run live (fixture: synthetic, transactions_groups.json).
      x-captured: "2026-10-15, www.roblox.com/communities/configure?id={id}#!/revenue/summary"
      x-rust-name: get_group_revenue_summary
      summary: A community's Robux in per category over the last day, week, month or year.
      parameters:
        - { in: path, name: groupId, required: true, type: integer, format: int64 }
        - { in: path, name: timeFrame, required: true, type: string, description: "Day, Week, Month or Year" }
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/GroupRevenueSummary" } }
  /challenge/v1/continue:
    post:
      # Captured 2026-10-15 from the site's Challenge.js bundle (www.roblox.com, any page that
      # answers a generic challenge: rblx-challenge-id/-type/-metadata response headers). Sent
      # after the user passes the challenge (two-step code, captcha), before the original
      # request is retried with the same id and type and base64(JSON) metadata. The site sends
      # the id as `challengeID` and the metadata as a JSON string. The answer can name a
      # further challenge. Not tried live: it needs an account Roblox challenges.
      x-captured: "2026-10-15, www.roblox.com Challenge.js (generic challenge continue)"
      x-rust-name: post_challenge_continue
      summary: Tell Roblox a challenge was passed.
      parameters:
        - { in: body, name: body, required: true, schema: { $ref: "#/definitions/ChallengeContinueRequest" } }
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/ChallengeContinueResponse" } }
  /captcha/v1/metadata:
    get:
      # Captured 2026-10-15 live (fixture: challenge_captcha.json) and from the site's
      # Captcha.js. Public. Maps a captcha action type to the Arkose public key that loads the
      # puzzle (ACTION_TYPE_GENERIC_CHALLENGE, ACTION_TYPE_GROUP_JOIN, ...).
      x-captured: "2026-10-15, www.roblox.com Captcha.js"
      x-rust-name: get_captcha_metadata
      summary: Arkose public keys per captcha action.
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/CaptchaMetadata" } }
definitions:
  ChallengeContinueRequest:
    type: object
    properties:
      challengeID: { type: string }
      challengeType: { type: string, description: "twostepverification, captcha, ..." }
      challengeMetadata: { type: string, description: "JSON text, not an object" }
  ChallengeContinueResponse:
    type: object
    properties:
      challengeId: { type: string }
      challengeType: { type: string }
      challengeMetadata: { type: string, description: "JSON text of the next challenge, if any" }
  CaptchaMetadata:
    type: object
    properties:
      funCaptchaPublicKeys: { type: object, additionalProperties: { type: string } }
  GamePassProductInfo:
    type: object
    properties:
      TargetId: { type: integer, format: int64 }
      ProductId: { type: integer, format: int64 }
