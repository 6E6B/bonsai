      groupPayoutsTotal: { type: integer, format: int64 }
      currencyPurchasesTotal: { type: integer, format: int64 }
      premiumStipendsTotal: { type: integer, format: int64 }
      tradeSystemEarningsTotal: { type: integer, format: int64 }
      tradeSystemCostsTotal: { type: integer, format: int64 }
      premiumPayoutsTotal: { type: integer, format: int64 }
      groupPremiumPayoutsTotal: { type: integer, format: int64 }
      adSpendTotal: { type: integer, format: int64 }
      developerExchangeTotal: { type: integer, format: int64 }
      pendingRobuxTotal: { type: integer, format: int64 }
      incomingRobuxTotal: { type: integer, format: int64 }
      outgoingRobuxTotal: { type: integer, format: int64 }
      individualToGroupTotal: { type: integer, format: int64 }
      csAdjustmentTotal: { type: integer, format: int64 }
      creatorRewardsPayoutsTotal: { type: integer, format: int64 }
      incomingRobuxTransferTotal: { type: integer, format: int64 }
      outgoingRobuxTransferTotal: { type: integer, format: int64 }
  TransactionTypeFlags:
    type: object
    # HasPurchase, HasSale, HasPremiumStipend, ... Read as a map so new flags don't break us.
    additionalProperties: { type: boolean }
  TransactionsPage:
    type: object
    properties:
      previousPageCursor: { type: string }
      nextPageCursor: { type: string }
      data: { type: array, items: { $ref: "#/definitions/TransactionRecord" } }
  TransactionRecord:
    type: object
    properties:
      idHash: { type: string }
      # A display name ("Currency Purchase"), not the query value.
      transactionType: { type: string }
      created: { type: string }
      isPending: { type: boolean }
      agent: { $ref: "#/definitions/TransactionAgent" }
      details: { $ref: "#/definitions/TransactionDetails" }
      currency: { $ref: "#/definitions/TransactionCurrency" }
  TransactionAgent:
    type: object
    properties:
