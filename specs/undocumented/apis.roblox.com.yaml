      x-captured: "2026-10-14, www.roblox.com/users/{id}/inventory Passes"
      x-rust-name: get_user_game_passes
      summary: Passes a user owns, newest first.
      parameters:
        - { in: path, name: userId, required: true, type: integer, format: int64 }
        - { in: query, name: count, required: false, type: integer, format: int32 }
        - { in: query, name: exclusiveStartId, required: false, type: integer, format: int64 }
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/UserGamePassesPage" } }
