# apis.roblox.com is not in the tracker. Only endpoints we use, with the fields we use.
swagger: "2.0"
host: apis.roblox.com
info: { title: "apis (undocumented)", version: undocumented }
paths:
  /universes/v1/places/{placeId}/universe:
    get:
      # Captured 2026-10-12 with a live request (fixture: place_universe.json).
      # Used by www.roblox.com/games/{placeId} to find the experience of a place; no sign-in needed.
      x-captured: "2026-10-12, experience page on www.roblox.com/games/1818"
      x-rust-name: get_place_universe
      summary: The universe (experience) a place belongs to.
      parameters:
        - { in: path, name: placeId, required: true, type: integer, format: int64 }
      responses:
        "200":
          description: OK
          schema: { $ref: "#/definitions/PlaceUniverse" }
  /explore-api/v1/get-sorts:
    get:
      # Captured 2026-10-12 with a live request (fixture: explore_sorts.json).
      # Used by www.roblox.com/charts and the Home page to list game sorts. Works signed out;
      # signed in it is personalized.
      x-captured: "2026-10-12, www.roblox.com/charts"
      x-rust-name: get_explore_sorts
      summary: Game sorts (Top Trending, Up-and-Coming, ...) with their first games.
      parameters:
        - { in: query, name: sessionId, required: true, type: string, description: "Random UUID per app session." }
        - { in: query, name: device, required: false, type: string, description: "computer, phone, tablet, console, vr" }
        - { in: query, name: country, required: false, type: string, description: "Two-letter code or all" }
        - { in: query, name: sortsPageToken, required: false, type: string }
      responses:
        "200":
          description: OK
          schema: { $ref: "#/definitions/ExploreSorts" }
  /search-api/omni-search:
    get:
      # Captured 2026-10-12 with a live request (fixture: omni_search.json).
      # Used by the search box on www.roblox.com (www.roblox.com/discover?Keyword=...).
      x-captured: "2026-10-12, www.roblox.com/discover?Keyword=adopt"
      x-rust-name: get_omni_search
      summary: Search games by keyword.
      parameters:
        - { in: query, name: searchQuery, required: true, type: string }
        - { in: query, name: sessionId, required: true, type: string, description: "Random UUID per app session." }
        - { in: query, name: pageType, required: false, type: string, description: "all or games" }
        - { in: query, name: pageToken, required: false, type: string }
      responses:
        "200":
          description: OK
          schema: { $ref: "#/definitions/OmniSearch" }
  /user-blocking-api/v1/users/get-blocked-users:
    get:
      # Captured 2026-10-12 live (fixture: blocking.json). www.roblox.com/my/account#!/privacy
      # "Blocked users". Needs the RBXEventTrackerV2 cookie (Client::browser_tracker).
      x-captured: "2026-10-12, www.roblox.com/my/account#!/privacy"
      x-rust-name: get_blocked_users
      summary: Users the signed-in account has blocked.
      parameters:
        - { in: query, name: cursor, required: false, type: string }
        - { in: query, name: count, required: true, type: integer, format: int32, description: "1 to 49" }
      responses:
        "200": { description: OK, schema: { $ref: "#/definitions/BlockedUsersResponse" } }
  /user-blocking-api/v1/users/{userId}/is-blocked:
    get:
      # Captured 2026-10-12 live (fixture: blocking.json). Profile page menu.
      x-captured: "2026-10-12, www.roblox.com/users/{id}/profile"
      x-rust-name: get_is_blocked
      summary: Whether the signed-in account blocked this user. The body is a bare boolean.
      parameters:
        - { in: path, name: userId, required: true, type: integer, format: int64 }
      responses:
        "200": { description: OK, schema: { type: boolean } }
  /user-blocking-api/v1/users/{userId}/block-user:
    post:
