      x-rust-name: post_unblock_user
      summary: Unblock a user. The body is a bare string like "Successfully unblocked user ...".
      parameters:
        - { in: path, name: userId, required: true, type: integer, format: int64 }
      responses:
        "200": { description: OK, schema: { type: string } }
