      x-captured: "2026-10-12, www.roblox.com/users/{id}/profile"
      x-rust-name: post_block_user
      summary: Block a user. The body is a bare string like "Successfully blocked user ...".
      parameters:
        - { in: path, name: userId, required: true, type: integer, format: int64 }
      responses:
        "200": { description: OK, schema: { type: string } }
