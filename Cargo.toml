[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/bonsai-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.90"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[workspace.dependencies]
bonsai-api = { path = "crates/bonsai-api" }
bonsai-hub-api = { path = "crates/bonsai-hub-api" }
bonsai-core = { path = "crates/bonsai-core" }
bonsai-plugin = { path = "crates/bonsai-plugin" }

reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "multipart", "http2", "charset", "gzip", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
fastrand = "2"
base64 = "0.23"
# Raw deflate for theme share codes. Already in the tree through reqwest.
flate2 = "1.1"
url = "2"
# Wiki article HTML, parsed in Rust so none of it reaches the webview. Already in the tree
# through tauri-utils.
dom_query = { version = "0.28", default-features = false }
heck = "0.5"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
keyring = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
nucleo-matcher = "0.3"
directories = "6"
sha2 = "0.11"
open = "5"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = { version = "2.5", features = [] }
# Linux window frame (src/frame.rs). Same version Tauri uses.
gtk = "=0.18.2"
# Lets the dev server page load our schemes (src/schemes.rs). Same version wry uses.
webkit2gtk = { version = "=2.0.2", features = ["v2_34"] }
# Copy link, Copy ID, CSV exports. Written from Rust, so the webview gets no clipboard permission.
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-clipboard-manager = "=2.4.0"
tauri-plugin-notification = "=2.5.0"
# Native file pickers for theme and plugin files. Opened from Rust, so the webview gets no file access.
# The XDG portal backend talks D-Bus; the gtk3 one starts a second GTK thread, which Tauri's GTK
# loop doesn't survive.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
wiremock = "0.6"
tempfile = "3"
# Plugin runtime: Luau has a sandbox mode, interrupts for time limits and a memory cap.
mlua = { version = "=0.12.2", features = ["luau"] }
# plugin.toml manifests.
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
