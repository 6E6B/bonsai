name: Rust

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      # The UI workflow covers the UI. Rust only writes bindings.ts.
      - "!crates/bonsai/ui/**"
      - "crates/bonsai/ui/src/lib/ipc/bindings.ts"
      - "!.github/workflows/ui.yml"
      - "!.github/workflows/release.yml"
      - "!.github/dependabot.yml"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "!crates/bonsai/ui/**"
      - "crates/bonsai/ui/src/lib/ipc/bindings.ts"
      - "!.github/workflows/ui.yml"
      - "!.github/workflows/release.yml"
      - "!.github/dependabot.yml"
  workflow_dispatch:

# A new push to a PR cancels its old run. Runs on main always finish.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: smaller caches and faster links. Backtraces still show function names.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  # Clippy and tests each compile the workspace, so they run as parallel jobs. Clippy runs on Linux
  # only: little code is platform-specific, and the test jobs fail on any rustc warning.
  lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-key: lint
          fast-deps: true
          bun: false

      # tauri::generate_context! needs ui/dist to exist. The UI workflow builds the real one.
      - name: Stub UI build
        run: mkdir -p crates/bonsai/ui/dist && echo '<!doctype html>' > crates/bonsai/ui/dist/index.html

      # Each check runs even if an earlier one failed, so one push reports every failure.
      - name: Format
        run: cargo fmt --all --check

      - name: Generated API code up to date
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo xtask codegen --check

      - name: Clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-key: test
          fast-deps: true
          bun: false

      - name: Stub UI build
        run: mkdir -p crates/bonsai/ui/dist && echo '<!doctype html>' > crates/bonsai/ui/dist/index.html

      - name: Install nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
          fallback: none

      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      # Nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --locked --doc

      # The export_bindings test rewrites bindings.ts; it must match what is committed.
      - name: Bindings up to date
        if: runner.os == 'Linux'
        run: |
          git diff --exit-code -- crates/bonsai/ui/src/lib/ipc/bindings.ts || {
            echo "::error::bindings.ts is stale. Run 'cargo test -p bonsai' and commit it."
            exit 1
          }
