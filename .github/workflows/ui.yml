name: UI

on:
  push:
    branches: [main]
    paths:
      - "crates/bonsai/ui/**"
      - "!**.md"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "crates/bonsai/ui/**"
      - "!**.md"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

# A new push to a PR cancels its old run. Runs on main always finish.
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ui:
    name: UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/bonsai/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck, lint, test
        run: bun run check
      - name: Build
        run: bun run build

  performance:
    name: UI performance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/bonsai/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check performance fixtures and runner
        run: bun run perf:check
      - name: Install browser engines
        run: bunx playwright install --with-deps chromium webkit
      - name: Exercise UI and measure performance
        run: bun run perf
      - name: Save performance reports and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-performance
          path: |
            crates/bonsai/ui/perf-results/report
            crates/bonsai/ui/perf-results/artifacts
          retention-days: 14
          if-no-files-found: ignore
