# Builds installers for every platform. A `v*` tag also creates a draft GitHub release with them;
# a manual run only uploads them as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: Check tag matches version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version in Cargo.toml."
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    # Runs on manual dispatch too, where `version` is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu, so the .deb and AppImage run on older glibc.
          - name: Linux x64
            os: ubuntu-22.04
            artifact: bonsai-linux-x64
            args: --bundles deb,appimage,rpm
          - name: Windows x64
            os: windows-latest
            artifact: bonsai-windows-x64
            args: --bundles nsis,msi
          - name: macOS universal
            os: macos-latest
            artifact: bonsai-macos-universal
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          rust-targets: ${{ matrix.rust-targets }}
          cache-key: release

      - name: Build installers
        working-directory: crates/bonsai/ui
        shell: bash
        env:
          BUNDLE_ARGS: ${{ matrix.args }}
          # linuxdeploy is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bun run tauri build $BUNDLE_ARGS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/dmg/*.dmg

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          find dist -type f -exec mv -t out {} +
          (cd out && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
