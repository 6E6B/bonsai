name: Setup
description: System libraries, the pinned Rust toolchain, and optionally bun and UI dependencies.

inputs:
  rust-targets:
    description: Extra rustup targets, space separated.
    default: ""
  cache-key:
    description: Extra key for the Rust cache, so jobs with different builds don't share one.
    default: ""
  cache-on-failure:
    description: Save partially built dependencies after a failed job.
    default: "true"
  fast-deps:
    description: Build dependencies without optimization. Halves a clean build; the tests run as fast.
    default: "false"
  bun:
    description: Install bun and the UI dependencies. Only `tauri build` needs them.
    default: "true"

runs:
  using: composite
  steps:
    # Tauri 2 on Linux: WebKitGTK, the tray (appindicator), muda's accelerators (xdo) and tao's D-Bus.
    # file and xdg-utils are used by the AppImage bundler.
    - name: Install Linux libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config file xdg-utils patchelf \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          libxdo-dev libdbus-1-dev libssl-dev

    # Keep target/ an ordinary directory. Mounting a Windows Dev Drive here makes the
    # cache action's manifest glob fail with ENOENT before it can restore or save.
    - name: Prepare Cargo target directory
      shell: bash
      run: mkdir -p target

    # Installs the toolchain from rust-toolchain.toml.
    - name: Install Rust
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.rust-targets }}
        FAST_DEPS: ${{ inputs.fast-deps }}
      run: |
        rustup toolchain install
        if [ -n "$RUST_TARGETS" ]; then rustup target add $RUST_TARGETS; fi
        # Cargo's user config overrides the [profile] in Cargo.toml.
        if [ "$FAST_DEPS" = true ]; then
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '[profile.dev.package."*"]\nopt-level = 0\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
        fi
        rustc --version

    # Only main saves. Every branch can restore main's cache, and the cache holds dependencies
    # only (workspace crates are rebuilt anyway), so a branch's own cache rarely helps. Branch
    # caches fill the 10 GB repo quota and evict main's, forcing cold builds. Test jobs may
    # save on failure, but releases wait for success so a partial build cannot become an
    # immutable exact-match cache that never gets updated.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      env:
        BONSAI_CACHE_TARGETS: ${{ inputs.rust-targets }}
      with:
        # Discard the ineffective macOS archives and failed Windows cache setup,
        # while retaining Linux's working dependency cache.
        prefix-key: ${{ runner.os == 'Linux' && 'v0-rust' || 'v1-rust' }}
        key: ${{ inputs.cache-key }}
        # Native and universal builds need different sets of compiled dependencies.
        env-vars: BONSAI_CACHE_TARGETS
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: ${{ inputs.cache-on-failure }}

    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2

    - name: Install UI dependencies
      if: inputs.bun == 'true'
      shell: bash
      working-directory: crates/bonsai/ui
      run: bun install --frozen-lockfile
