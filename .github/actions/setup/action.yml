name: Setup
description: System libraries, the pinned Rust toolchain, bun and UI dependencies.

inputs:
  rust-targets:
    description: Extra rustup targets, space separated.
    default: ""
  cache-key:
    description: Extra key for the Rust cache, so jobs with different builds don't share one.
    default: ""

runs:
  using: composite
  steps:
    # Tauri 2 on Linux: WebKitGTK, the tray (appindicator), muda's accelerators (xdo) and tao's D-Bus.
    # file and xdg-utils are used by the AppImage bundler.
    - name: Install Linux libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config file xdg-utils patchelf \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          libxdo-dev libdbus-1-dev libssl-dev

    # Installs the toolchain from rust-toolchain.toml.
    - name: Install Rust
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.rust-targets }}
      run: |
        rustup toolchain install
        if [ -n "$RUST_TARGETS" ]; then rustup target add $RUST_TARGETS; fi
        rustc --version

    # Caches from other branches and tags can't be restored elsewhere, so only main saves one.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2

    - name: Install UI dependencies
      shell: bash
      working-directory: crates/bonsai/ui
      run: bun install --frozen-lockfile
