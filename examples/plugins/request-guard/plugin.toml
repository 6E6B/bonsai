id = "request-guard"
name = "Request guard"
version = "0.1.0"
author = "bonsai"
entry = "main.luau"
bonsai = 1

permissions = ["read.public", "read.account", "notify"]
actions = ["user.decline_friend"]

[[settings]]
key = "min_age"
title = "Decline accounts younger than"
description = "In days."
kind = "range"
min = 0
max = 365
default = 30

[[settings]]
key = "min_friends"
title = "Decline accounts with fewer friends than"
kind = "range"
min = 0
max = 50
default = 0

[[settings]]
key = "decline_banned"
title = "Decline banned accounts"
kind = "bool"
default = true
